
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./cat.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <img id="card" src="./bigcat.png" />
        <a-asset-item id="avatarModel" src="./Oiiiaii_Cat.gltf"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane>
        <a-gltf-model rotation="0 0 0"position="0 0 0.4"scale="0.009 0.009 0.009"src="#avatarModel"
              animation__float="property: position; to: 0 0.1 0.1; dur: 500; easing: easeInOutQuad; loop: true; dir: alternate"
              animation__rotate="property: rotation; to: 0 360 0; dur: 1000; easing: linear; loop: true">
</a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
